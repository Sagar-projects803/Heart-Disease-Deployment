<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Risk Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>❤️ Heart Disease Risk Predictor</h1>

    <p class="subtitle">
        Enter the patient's clinical information to predict the likelihood of heart disease.
    </p>

    <form id="predict-form">

        <div class="grid">

            <div class="field">
                <label>Age</label>
                <input type="number" name="age" placeholder="45" required>
            </div>

            <div class="field">
                <label>Gender</label>
                <select name="sex">
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div class="field">
                <label>Chest Pain Type</label>
                <select name="cp">
                    <option value="0">Typical Angina</option>
                    <option value="1">Atypical Angina</option>
                    <option value="2">Non-anginal Pain</option>
                    <option value="3">Asymptomatic</option>
                </select>
            </div>

            <div class="field">
                <label>Resting Blood Pressure (mmHg)</label>
                <input type="number" name="trestbps" placeholder="120" required>
            </div>

            <div class="field">
                <label>Serum Cholesterol (mg/dl)</label>
                <input type="number" name="chol" placeholder="200" required>
            </div>

            <div class="field">
                <label>Fasting Blood Sugar</label>
                <select name="fbs">
                    <option value="0">≤ 120 mg/dl</option>
                    <option value="1">> 120 mg/dl</option>
                </select>
            </div>

            <div class="field">
                <label>Resting ECG</label>
                <select name="restecg">
                    <option value="0">Normal</option>
                    <option value="1">ST-T Wave Abnormality</option>
                    <option value="2">Left Ventricular Hypertrophy</option>
                </select>
            </div>

            <div class="field">
                <label>Maximum Heart Rate</label>
                <input type="number" name="thalach" placeholder="150" required>
            </div>

            <div class="field">
                <label>Exercise Induced Angina</label>
                <select name="exang">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="field">
                <label>ST Depression (Oldpeak)</label>
                <input type="number" step="0.1" name="oldpeak" placeholder="1.0" required>
            </div>

            <div class="field">
                <label>ST Slope</label>
                <select name="slope">
                    <option value="0">Upsloping</option>
                    <option value="1">Flat</option>
                    <option value="2">Downsloping</option>
                </select>
            </div>

            <div class="field">
                <label>Number of Major Vessels (0–4)</label>
                <select name="ca">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <div class="field full">
                <label>Thalassemia</label>
                <select name="thal">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>

        </div>

        <button type="submit">Predict Risk</button>

    </form>

    <div id="result"></div>

    <p class="footer">
        ⚠️ This application is for educational purposes only and should not be used as a medical diagnosis.
    </p>

</div>

<script>

const form=document.getElementById("predict-form");
const result=document.getElementById("result");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const payload={};

new FormData(form).forEach((value,key)=>{

payload[key]=parseFloat(value);

});

result.className="";
result.style.display="block";
result.innerHTML="Predicting...";

try{

const response=await fetch("/predict",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(payload)

});

const data=await response.json();

if(data.error){

result.className="error";

result.innerHTML=data.error;

return;

}

if(data.prediction_label===1){

result.className="danger";

result.innerHTML=`
<h2>🔴 High Risk</h2>
<p><strong>${data.prediction}</strong></p>
<p>Confidence : ${(data.probability*100).toFixed(1)}%</p>
`;

}

else{

result.className="success";

result.innerHTML=`
<h2>🟢 Low Risk</h2>
<p><strong>${data.prediction}</strong></p>
<p>Confidence : ${(data.probability*100).toFixed(1)}%</p>
`;

}

}

catch(err){

result.className="error";

result.innerHTML="Request Failed : "+err.message;

}

});

</script>

</body>
</html>
